# LIBERTA หัวหิน — frontend container Nginx config (production static SPA)
#
# Serves the Vite production build and handles client-side routing fallback.
# This is the ONLY place that does SPA `try_files` — the reverse-proxy layer
# (nginx.prod.conf) just forwards to this container with a plain proxy_pass.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml;

    # Vite hashes built asset filenames (e.g. /assets/index-abc123.js), so it
    # is safe to cache them aggressively — a new deploy ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, otherwise returning visitors keep
    # loading a stale shell that references old (deleted) hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: any unmatched path resolves to index.html so client-side
    # routing works on refresh / direct navigation.
    location / {
        try_files $uri /index.html;
    }
}
