# LIBERTA หัวหิน — Nginx reverse proxy config (development)
#
# HTTP on port 80 AND HTTPS on port 443 (self-signed cert from the `ca`
# container, see docker-compose.yml + nginx/ca/). Both are served — dev
# intentionally does not force a redirect to 443, so either can be used
# directly. Proxies /api/* to each of the 6 backend services on the Docker
# network, serves room images as static files, and proxies everything else
# to the Vite dev server (including the HMR websocket upgrade).

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 10M;

    # Two rate-limit tiers, keyed by client IP:
    #   sensitive_limit — auth/booking-creation/guest-registration endpoints that are
    #     attractive targets for brute-force, enumeration, or spam.
    #   general_limit   — everything else under /api/.
    limit_req_zone $binary_remote_addr zone=sensitive_limit:10m rate=8r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        # No Content-Security-Policy header in dev: Vite's dev server injects
        # inline bootstrap scripts (React Refresh) and the HMR client, which a
        # 'self'-only script-src would block outright (confirmed: blank page,
        # CSP silently blocking every inline/module script). CSP is enforced
        # in the production Nginx image instead (frontend/nginx.frontend.conf),
        # where the frontend is a static pre-built bundle with no inline
        # scripts and CSP is actually safe to apply.

        # --- auth-service (3001) ---
        # Internal-only issue-token endpoint must never be reachable from outside the
        # Docker network — defense in depth on top of the app-level InternalKeyGuard.
        location /api/auth/internal/ {
            return 404;
        }

        location = /api/auth/login {
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://auth-service:3001/auth/login;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/auth/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://auth-service:3001/auth/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- mfa-service (3002) ---
        location /api/mfa/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://mfa-service:3002/mfa/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- guest-service (3003) ---
        location = /api/guests/register {
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://guest-service:3003/guests/register;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/guests/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://guest-service:3003/guests/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- room-service (3004) ---
        # Exact-match locations for the bare list endpoints (frontend calls
        # GET /rooms and /room-types with no trailing slash) — without these,
        # nginx's own trailing-slash redirect for proxy_pass locations kicks
        # in, and that redirect is built from nginx's *internal* listening
        # port (443), not whatever host port Docker actually maps it to
        # (8080/8443 here) — the browser's follow-up request then hits the
        # wrong port and hangs instead of failing fast. See nginx docs on
        # "location" + proxy_pass trailing-slash behavior.
        location = /api/rooms {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://room-service:3004/rooms;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/rooms/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://room-service:3004/rooms/;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/room-types {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://room-service:3004/room-types;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/room-types/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://room-service:3004/room-types/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- booking-service (3005) ---
        location = /api/bookings/draft {
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://booking-service:3005/bookings/draft;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/bookings/lookup {
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://booking-service:3005/bookings/lookup;
            include /etc/nginx/proxy_params.conf;
        }

        # Bare list endpoint (frontend calls GET /bookings with no trailing
        # slash) — same exact-match fix as /rooms and /room-types above.
        location = /api/bookings {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://booking-service:3005/bookings;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/bookings/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://booking-service:3005/bookings/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- admin-service (3006) ---
        location /api/admin/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://admin-service:3006/admin/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Room images: public, read-only marketing content ---
        # Served directly from the shared room_images volume — never proxied to room-service.
        location /uploads/rooms/ {
            alias /var/www/uploads/rooms/;
            expires 7d;
        }

        # --- Frontend (Vite dev server), including HMR websocket upgrade ---
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
