# LIBERTA หัวหิน — Nginx reverse proxy config (production)
# Placeholder created in Stage 1; full TLS + routing rules land in Stage 4/6.
#
# Production will terminate TLS here (self-signed OpenSSL cert, see docs/DEPLOYMENT.md)
# and proxy to each service by name on the internal Docker network, plus serve
# the built frontend as static files.

events {}

http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location / {
            return 200 'LIBERTA nginx prod placeholder — TLS + routing not yet configured (Stage 4/6)\n';
            add_header Content-Type text/plain;
        }
    }
}
