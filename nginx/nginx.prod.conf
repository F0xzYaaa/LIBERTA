# LIBERTA หัวหิน — Nginx reverse proxy config (production)
#
# Live routes: auth, mfa, guest, room, booking, admin, frontend (Stage 1-5,
# all built). The frontend location just proxies to the frontend container's
# own Nginx (which serves the static SPA build and handles the SPA fallback
# itself) — no try_files at this layer.

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 10M;

    # Rate limiting — closes the HIGH findings from the Stage 2/3 security audits
    # (decisions.md 2026-07-06 20:10, 21:30) and matches the two-zone scheme the
    # Stage 4 architect session specified (decisions.md 2026-07-07 architect
    # session): sensitive_limit on auth/booking/guest write endpoints prone to
    # brute-force/enumeration, general_limit as a floor on everything else /api/.
    limit_req_zone $binary_remote_addr zone=sensitive_limit:10m rate=8r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

    # ---- HTTP -> HTTPS redirect ----
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        # img-src needs data: for MFA's qrCodeDataUri and blob: for the payment-slip
        # viewer's authenticated-fetch object URLs (frontend/src/pages/admin/BookingDetailPage.tsx).
        # style-src 'unsafe-inline' is required by Tailwind's runtime-injected styles.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

        # --- auth-service (3001) ---
        # Internal-only issue-token endpoint must never be reachable from outside
        # the Docker network (decisions.md 2026-07-06 19:20). Block before the
        # general /api/auth/ proxy below — nginx picks the longest matching
        # prefix, so this wins regardless of directive order.
        location /api/auth/internal/ {
            return 404;
        }

        location = /api/auth/login {
            limit_req zone=general_limit burst=20 nodelay;
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://auth-service:3001/auth/login;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/auth/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://auth-service:3001/auth/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- mfa-service (3002) ---
        location /api/mfa/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://mfa-service:3002/mfa/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- guest-service (3003) ---
        location = /api/guests/register {
            limit_req zone=general_limit burst=20 nodelay;
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://guest-service:3003/guests/register;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/guests/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://guest-service:3003/guests/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- room-service (3004) ---
        location /api/rooms/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://room-service:3004/rooms/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/room-types/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://room-service:3004/room-types/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- booking-service (3005) ---
        location = /api/bookings/draft {
            limit_req zone=general_limit burst=20 nodelay;
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://booking-service:3005/bookings/draft;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/bookings/lookup {
            limit_req zone=general_limit burst=20 nodelay;
            limit_req zone=sensitive_limit burst=3 nodelay;
            proxy_pass http://booking-service:3005/bookings/lookup;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/bookings/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://booking-service:3005/bookings/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- admin-service (3006) ---
        location /api/admin/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://admin-service:3006/admin/;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Room images: public, read-only marketing content ---
        location /uploads/rooms/ {
            alias /var/www/uploads/rooms/;
            expires 7d;
        }

        # Payment slips are intentionally NOT exposed here at all — per the
        # Stage 4 architect decision (decisions.md 2026-07-07), slips are only
        # ever served through the authenticated GET /bookings/:id/slip endpoint
        # (JwtAuthGuard + RolesGuard), never as a static Nginx path. Do not add
        # a /uploads/slips/ location here, even an `internal` one.

        # --- Frontend SPA ---
        # The frontend container runs its own Nginx (frontend/nginx.frontend.conf)
        # which serves the static build and handles the SPA `try_files` fallback.
        # This layer only reverse-proxies to it — combining proxy_pass with
        # try_files in a single location block is invalid Nginx syntax.
        location / {
            proxy_pass http://frontend:80;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
